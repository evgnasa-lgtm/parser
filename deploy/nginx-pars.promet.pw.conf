# Example for a NEW host. Merge into an existing host instead of duplicating it.
# Preserve your existing HTTPS listener and certificate directives.
server {
    listen 80;
    server_name pars.promet.pw;
    root /var/www/pars.promet.pw/public;
    index index.html;
    charset utf-8;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
}
